<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.4" intercept="-.25"/>
        <feFuncG type="linear" slope="1.5" intercept="-.23"/>
        <feFuncB type="linear" slope="1.4" intercept="-.25"/>
      </feComponentTransfer>
    </filter>
    <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .15" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="384" height="384" filter="url(#grain)" opacity=".75"/>
  <rect width="384" height="384" filter="url(#wear)" opacity=".25"/>
</svg>
